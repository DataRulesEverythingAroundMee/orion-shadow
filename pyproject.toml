
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-shadow"
version = "0.1.0"
description = "Orion Gimbal & Camera Simulator for SIL/HIL testing (targeting Orion SDK 3.1.9)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
gpu = [
    # Replace 'cuda13x' / non-suffixed packages with your installed CUDA version (e.g. cuda12x)
    "cupy-cuda13x[ctk]>=13.0.0",
    "nvidia-cuda-runtime",
    "nvidia-cuda-nvrtc",
    "nvidia-nvjitlink",
    "nvidia-cublas",
    "nvidia-cuda-cupti",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
